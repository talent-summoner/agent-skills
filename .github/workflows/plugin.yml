# [INPUT]: Root plugin manifests (.claude-plugin/, .cursor-plugin/, .mcp.json) and the exported skill.
# [OUTPUT]: Claude Code strict plugin validation plus manifest, MCP server and skill-hash consistency.
# [POS]: Plugin CI beside the npm package checks in release.yml.
# [PROTOCOL]: Pin the Claude Code CLI version; bump it deliberately.
name: Verify plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: node scripts/verify-plugin.mjs
      - run: npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate . --strict
      - run: npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate .claude-plugin/plugin.json --strict
